name: Deploy customer site

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: rental_sites.id (uuid)
        required: true
        type: string
      version_id:
        description: site_versions.id (uuid)，留空則使用 live_version_id
        required: false
        type: string

# 同一個網站同時只跑一個；後來的排隊，不取消正在跑的
concurrency:
  group: deploy-${{ inputs.site_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build and deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_ID: ${{ inputs.site_id }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [ -n "$VERSION_ID" ]; then
            node build/build-site.mjs --site-id "$SITE_ID" --version-id "$VERSION_ID"
          else
            node build/build-site.mjs --site-id "$SITE_ID"
          fi
