name: Smoke check

# 手動執行：檢查官網、版型展示與 Edge Function 是否正常回應（只讀取，不改任何東西）。結果顯示在執行摘要。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          F=https://gatgcuntwqibpxhjviqw.supabase.co/functions/v1
          bad=0
          note() { echo "::notice::$1"; }
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          for o in https://chi1017.github.io https://yc-axiom.pages.dev https://not-allowed.example; do
            r="fetch-page=$(code -H "Origin: $o" "$F/fetch-page?url=https://example.com/")"
            for f in member-site publish-site admin-site; do
              a=$(curl -s -D - -o /dev/null -X OPTIONS -H "Origin: $o" -H "Access-Control-Request-Method: POST" "$F/$f" | grep -i '^access-control-allow-origin' | tr -d '\r' | awk '{print $2}')
              r="$r $f=${a:-none}"
            done
            note "$o → $r"
          done
          s=""; for f in serif sans round kai; do s="$s $f=$(curl -s -o /dev/null -w '%{http_code}/%{size_download}B/%{time_total}s' "$F/font-subset?f=$f&t=%E5%8D%88%E5%BE%8C%E6%97%A5%E5%85%89%E5%92%96%E5%95%A1")"; done; note "font-subset:$s"
          note "pagespeed: $(curl -s -m 90 -H 'Origin: https://yc-axiom.pages.dev' "$F/pagespeed?url=https%3A%2F%2Fyc-axiom.pages.dev%2F&strategy=mobile" -o /tmp/ps.json -w '%{http_code}') $(python3 -c 'import json;d=json.load(open("/tmp/ps.json"));c=d.get("lighthouseResult",{}).get("categories",{});print(d.get("error") or {k:v.get("score") for k,v in c.items()})' 2>&1 | head -c 300) ／ 其他網站呼叫：$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://not-allowed.example' "$F/pagespeed?url=https%3A%2F%2Fexample.com%2F")"
          s=""; for u in / /version.txt /robots.txt /sitemap.xml /llms.txt /rental/ /rental/templates/ /articles/ /articles/shop-website-vs-instagram/ /articles/chatgpt-recommend-your-shop/ /seo/ /geo/ /builder/ /dashboard/ /terms/rental/ /no-such-page/; do s="$s $u=$(code "https://yc-axiom.pages.dev$u")"; done; note "官網:$s"
          note "robots: $(curl -s https://yc-axiom.pages.dev/robots.txt | tr '\n' ' ') ／ canonical: $(curl -s https://yc-axiom.pages.dev/ | grep -o '<link rel="canonical"[^>]*>')"
          n=$(curl -s https://yc-templates.pages.dev/gallery.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
          s=""; for k in $(curl -s https://yc-templates.pages.dev/gallery.json | python3 -c 'import json,sys; print(" ".join(x["key"] for x in json.load(sys.stdin)))'); do t=$(curl -s -o /dev/null -w "%{http_code}/%{size_download}" https://yc-templates.pages.dev/$k/thumb.webp); p=$(code https://yc-templates.pages.dev/$k/); [ "$p" = 200 ] && [ "${t%%/*}" = 200 ] || s="$s $k=$p,$t"; done
          note "版型展示 $n 個；有問題的：${s:-無}"
          note "版型展示 /cafe/ 內容：$(curl -s https://yc-templates.pages.dev/cafe/ | grep -o '<title>[^<]*\|noindex[^"]*\|此為版型範例[^<]*' | tr '\n' ' ')"
