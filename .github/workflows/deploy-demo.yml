name: Deploy demo sites

# 手動執行：部署對外展示用的示範站（多頁版＋雜誌式首頁），舊的兩個示範網址改成轉址。示範店家是虛構的，一律 noindex。
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'main＝對外示範站；compare＝與 Wix 同內容量的比較站'
        required: false
        default: main

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node build/deploy-demo.mjs ${{ inputs.which == 'compare' && '--compare' || '' }}
